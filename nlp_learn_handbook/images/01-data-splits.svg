<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540">
  <rect width="1400" height="540" fill="#f7fafc"/>
  <text x="70" y="66" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">训练集、验证集、测试集各自做什么</text>
  <text x="70" y="108" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526579">测试集只在方案和 checkpoint 确定后使用，避免把测试结果变成调参信号</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="70" y="205" width="250" height="125" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="195" y="253" font-size="24" font-weight="700" fill="#194c4b">训练集</text><text x="195" y="288" font-size="19" fill="#194c4b">更新模型参数</text>
    <rect x="410" y="205" width="250" height="125" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="535" y="253" font-size="24" font-weight="700" fill="#1f4d7a">验证集</text><text x="535" y="288" font-size="19" fill="#1f4d7a">选配置和 checkpoint</text>
    <rect x="750" y="205" width="250" height="125" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="875" y="253" font-size="24" font-weight="700" fill="#7a4c10">测试集</text><text x="875" y="288" font-size="19" fill="#7a4c10">最后一次独立评估</text>
    <rect x="1090" y="205" width="240" height="125" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="1210" y="253" font-size="24" font-weight="700" fill="#64316c">报告</text><text x="1210" y="288" font-size="19" fill="#64316c">只写已验证事实</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M320 268 H400 M660 268 H740 M1000 268 H1080"/><path d="M370 258 L410 268 L370 278 M710 258 L750 268 L710 278 M1050 258 L1090 268 L1050 278"/></g>
  <rect x="250" y="405" width="900" height="60" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="443" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">错误做法：反复查看测试集，再调整规则，最后仍把它称为独立测试</text>
</svg>
