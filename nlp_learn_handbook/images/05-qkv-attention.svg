<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#f7fafc"/>
  <text x="70" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">Scaled Dot-Product Attention 的计算链</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="70" y="220" width="180" height="110" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="160" y="263" font-size="24" font-weight="700" fill="#194c4b">Query</text><text x="160" y="298" font-size="19" fill="#194c4b">我现在找什么</text>
    <rect x="70" y="385" width="180" height="110" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="160" y="428" font-size="24" font-weight="700" fill="#1f4d7a">Key</text><text x="160" y="463" font-size="19" fill="#1f4d7a">怎样匹配</text>
    <rect x="70" y="50" width="180" height="110" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="160" y="93" font-size="24" font-weight="700" fill="#7a4c10">Value</text><text x="160" y="128" font-size="19" fill="#7a4c10">匹配后读取</text>
    <rect x="370" y="220" width="220" height="110" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="480" y="263" font-size="24" font-weight="700" fill="#1f4d7a">Q K 转置</text><text x="480" y="298" font-size="19" fill="#1f4d7a">匹配分数</text>
    <rect x="710" y="220" width="220" height="110" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="820" y="263" font-size="24" font-weight="700" fill="#7a4c10">缩放与 mask</text><text x="820" y="298" font-size="19" fill="#7a4c10">除以 sqrt(d_k)</text>
    <rect x="1050" y="220" width="220" height="110" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="1160" y="263" font-size="24" font-weight="700" fill="#64316c">softmax</text><text x="1160" y="298" font-size="19" fill="#64316c">得到注意力权重</text>
    <rect x="1050" y="385" width="220" height="110" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/><text x="1160" y="428" font-size="24" font-weight="700" fill="#35592f">加权 Value</text><text x="1160" y="463" font-size="19" fill="#35592f">输出上下文</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M250 270 H360 M250 440 C400 440 400 310 700 280 M250 105 C450 105 450 195 1030 245"/><path d="M590 275 H700 M930 275 H1040 M1160 330 V375"/><path d="M340 260 L370 270 L340 280 M680 270 L710 280 L680 290 M1010 265 L1050 275 L1010 285 M1150 355 L1160 385 L1170 355"/></g>
  <text x="700" y="560" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">Q 决定查询，K 决定匹配，V 提供内容；三者角色不同但共同产生上下文表示</text>
</svg>
