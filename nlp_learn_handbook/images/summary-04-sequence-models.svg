<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540">
  <rect width="1400" height="540" fill="#f7fafc"/>
  <text x="70" y="66" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">第 04 节总结：序列模型从状态到注意力</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="60" y="205" width="210" height="125" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="165" y="253" font-size="24" font-weight="700" fill="#194c4b">Embedding</text><text x="165" y="288" font-size="19" fill="#194c4b">token 序列</text>
    <rect x="320" y="205" width="210" height="125" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="425" y="253" font-size="24" font-weight="700" fill="#1f4d7a">RNN / LSTM</text><text x="425" y="288" font-size="19" fill="#1f4d7a">隐藏状态保留历史</text>
    <rect x="580" y="205" width="210" height="125" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="685" y="253" font-size="24" font-weight="700" fill="#7a4c10">Encoder</text><text x="685" y="288" font-size="19" fill="#7a4c10">读取源序列</text>
    <rect x="840" y="205" width="210" height="125" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="945" y="253" font-size="24" font-weight="700" fill="#64316c">Attention</text><text x="945" y="288" font-size="19" fill="#64316c">按位置读取信息</text>
    <rect x="1100" y="205" width="240" height="125" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/><text x="1220" y="253" font-size="24" font-weight="700" fill="#35592f">Decoder</text><text x="1220" y="288" font-size="19" fill="#35592f">训练并行 / 推理自回归</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M270 268 H310 M530 268 H570 M790 268 H830 M1050 268 H1090"/><path d="M300 258 L320 268 L300 278 M560 258 L580 268 L560 278 M820 258 L840 268 L820 278 M1080 258 L1100 268 L1080 278"/></g>
  <rect x="255" y="405" width="890" height="60" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="443" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">核心区别：循环模型压缩历史，Attention 允许当前状态直接读取相关位置</text>
