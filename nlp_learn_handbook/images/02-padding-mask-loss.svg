<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <rect width="1400" height="650" fill="#f7fafc"/>
  <text x="70" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">Padding 为什么需要同时影响 attention 和 loss</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="250" y="145" font-size="25" font-weight="700" fill="#1f4d7a">同一 batch 的不同长度</text>
    <rect x="80" y="180" width="340" height="70" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="250" y="224" font-size="22" fill="#194c4b">我 喜欢 猫 &lt;eos&gt;</text>
    <rect x="80" y="275" width="340" height="70" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="250" y="319" font-size="22" fill="#1f4d7a">他 学习 &lt;eos&gt; &lt;pad&gt;</text>
    <rect x="80" y="370" width="340" height="70" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="250" y="414" font-size="22" fill="#1f4d7a">我 看书 &lt;eos&gt; &lt;pad&gt;</text>
    <text x="690" y="145" font-size="25" font-weight="700" fill="#7a4c10">mask：不读取 padding</text>
    <rect x="520" y="180" width="340" height="260" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="690" y="230" font-size="22" fill="#7a4c10">attention_mask</text><text x="690" y="278" font-size="22" fill="#7a4c10">[1, 1, 1, 1]</text><text x="690" y="326" font-size="22" fill="#7a4c10">[1, 1, 1, 0]</text><text x="690" y="374" font-size="22" fill="#7a4c10">[1, 1, 1, 0]</text>
    <text x="1120" y="145" font-size="25" font-weight="700" fill="#64316c">loss：不监督 padding</text>
    <rect x="950" y="180" width="340" height="260" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="1120" y="230" font-size="22" fill="#64316c">有效 label</text><text x="1120" y="278" font-size="22" fill="#64316c">猫 / &lt;eos&gt;</text><text x="1120" y="326" font-size="22" fill="#64316c">最后位置 = -100</text><text x="1120" y="374" font-size="22" fill="#64316c">ignore_index</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M420 310 H500 M860 310 H930"/><path d="M480 300 L520 310 L480 320 M910 300 L950 310 L910 320"/></g>
  <rect x="230" y="510" width="940" height="60" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="548" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">只 mask 输入、不忽略目标 padding，会让模型被要求学习“预测补齐符号”</text>
</svg>
