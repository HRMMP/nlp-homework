<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <rect width="1400" height="600" fill="#f7fafc"/>
  <text x="70" y="66" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">第 06 节总结：预训练模型如何连接下游任务</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="80" y="220" width="250" height="130" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="205" y="270" font-size="24" font-weight="700" fill="#194c4b">预训练</text><text x="205" y="305" font-size="19" fill="#194c4b">学习一般语言规律</text>
    <rect x="425" y="160" width="270" height="130" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="560" y="210" font-size="24" font-weight="700" fill="#1f4d7a">BERT Encoder</text><text x="560" y="245" font-size="19" fill="#1f4d7a">MLM / 双向表示</text>
    <rect x="425" y="380" width="270" height="130" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="560" y="430" font-size="24" font-weight="700" fill="#7a4c10">GPT Decoder</text><text x="560" y="465" font-size="19" fill="#7a4c10">next-token / 自回归</text>
    <rect x="810" y="160" width="250" height="130" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="935" y="210" font-size="24" font-weight="700" fill="#64316c">NER</text><text x="935" y="245" font-size="19" fill="#64316c">每个位置分类</text>
    <rect x="810" y="380" width="250" height="130" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/><text x="935" y="430" font-size="24" font-weight="700" fill="#35592f">生成任务</text><text x="935" y="465" font-size="19" fill="#35592f">Prompt -> token</text>
    <rect x="1130" y="255" width="210" height="130" rx="8" fill="#ffffff" stroke="#638a5e" stroke-width="3"/><text x="1235" y="305" font-size="24" font-weight="700" fill="#35592f">微调 / 推理</text><text x="1235" y="340" font-size="19" fill="#35592f">任务输出</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M330 285 C370 285 370 225 415 225 M330 285 C370 285 370 445 415 445 M695 225 H800 M695 445 H800 M1060 225 C1090 225 1090 300 1120 300 M1060 445 C1090 445 1090 340 1120 340"/><path d="M400 215 L425 225 L400 235 M400 435 L425 445 L400 455 M790 215 L810 225 L790 235 M790 435 L810 445 L790 455 M1100 290 L1130 300 L1100 310 M1100 330 L1130 340 L1100 350"/></g>
  <text x="700" y="560" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">结构相近不等于目标相同：BERT 侧重理解，GPT 侧重根据前缀生成</text>
