<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <rect width="1400" height="560" fill="#f7fafc"/>
  <text x="70" y="70" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">监督学习的一个 batch</text>
  <text x="70" y="112" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526579">训练阶段：预测、比较、计算梯度、更新参数</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="60" y="205" width="190" height="120" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/>
    <text x="155" y="252" font-size="24" font-weight="700" fill="#194c4b">输入 batch</text>
    <text x="155" y="287" font-size="19" fill="#194c4b">x, target</text>
    <rect x="310" y="205" width="190" height="120" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/>
    <text x="405" y="252" font-size="24" font-weight="700" fill="#1f4d7a">前向传播</text>
    <text x="405" y="287" font-size="19" fill="#1f4d7a">prediction = model(x)</text>
    <rect x="560" y="205" width="190" height="120" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/>
    <text x="655" y="252" font-size="24" font-weight="700" fill="#7a4c10">计算 loss</text>
    <text x="655" y="287" font-size="19" fill="#7a4c10">compare(pred, target)</text>
    <rect x="810" y="205" width="190" height="120" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/>
    <text x="905" y="252" font-size="24" font-weight="700" fill="#64316c">反向传播</text>
    <text x="905" y="287" font-size="19" fill="#64316c">loss.backward()</text>
    <rect x="1060" y="205" width="260" height="120" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/>
    <text x="1190" y="252" font-size="24" font-weight="700" fill="#35592f">更新参数</text>
    <text x="1190" y="287" font-size="19" fill="#35592f">optimizer.step()</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 265 H300 M500 265 H550 M750 265 H800 M1000 265 H1050"/>
    <path d="M295 255 L310 265 L295 275 M545 255 L560 265 L545 275 M795 255 L810 265 L795 275 M1045 255 L1060 265 L1045 275"/>
  </g>
  <rect x="250" y="405" width="900" height="72" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/>
  <text x="700" y="450" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#374b60">每个 batch 训练前清空旧梯度；评估时切换 eval() 并关闭梯度</text>
</svg>
