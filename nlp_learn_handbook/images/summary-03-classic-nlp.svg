<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540">
  <rect width="1400" height="540" fill="#f7fafc"/>
  <text x="70" y="66" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">第 03 节总结：经典方法提供可解释基线</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="100" y="170" width="540" height="125" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/>
    <text x="370" y="211" font-size="24" font-weight="700" fill="#194c4b">文档分类</text>
    <text x="370" y="252" font-size="20" fill="#194c4b">词袋 / n-gram -> 可选 TF-IDF -> 分类器 -> 类别</text>
    <rect x="760" y="170" width="540" height="125" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/>
    <text x="1030" y="211" font-size="24" font-weight="700" fill="#1f4d7a">n-gram 语言模型</text>
    <text x="1030" y="252" font-size="20" fill="#1f4d7a">历史 token -> 下一个 token 的概率</text>
    <rect x="100" y="335" width="540" height="125" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/>
    <text x="370" y="376" font-size="24" font-weight="700" fill="#7a4c10">静态词向量</text>
    <text x="370" y="417" font-size="20" fill="#7a4c10">词 -> 固定向量表示</text>
    <rect x="760" y="335" width="540" height="125" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/>
    <text x="1030" y="376" font-size="24" font-weight="700" fill="#64316c">序列标注</text>
    <text x="1030" y="417" font-size="20" fill="#64316c">token 序列 -> HMM / MEMM / CRF -> 标签</text>
  </g>
  <rect x="220" y="500" width="960" height="60" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="538" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">这些是不同任务的表示或模型，不是一条必须依次经过的流水线</text>
</svg>
