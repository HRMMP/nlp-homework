<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <rect width="1400" height="560" fill="#f7fafc"/>
  <text x="70" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">一个典型 Transformer Encoder 层</text>
  <text x="70" y="106" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526579">Attention 混合位置之间的信息，FFN 对每个位置做相同的非线性变换</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="60" y="220" width="180" height="100" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="150" y="260" font-size="24" font-weight="700" fill="#194c4b">输入 x</text><text x="150" y="293" font-size="19" fill="#194c4b">(B, L, H)</text>
    <rect x="310" y="220" width="220" height="100" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="420" y="260" font-size="24" font-weight="700" fill="#1f4d7a">Self-Attention</text><text x="420" y="293" font-size="19" fill="#1f4d7a">混合位置</text>
    <rect x="600" y="220" width="220" height="100" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="710" y="260" font-size="24" font-weight="700" fill="#7a4c10">残差 + LayerNorm</text><text x="710" y="293" font-size="19" fill="#7a4c10">保留信息并稳定训练</text>
    <rect x="890" y="220" width="180" height="100" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="980" y="260" font-size="24" font-weight="700" fill="#64316c">FFN</text><text x="980" y="293" font-size="19" fill="#64316c">逐位置变换</text>
    <rect x="1140" y="220" width="200" height="100" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/><text x="1240" y="260" font-size="24" font-weight="700" fill="#35592f">输出</text><text x="1240" y="293" font-size="19" fill="#35592f">上下文表示</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M240 270 H300 M530 270 H590 M820 270 H880 M1070 270 H1130"/><path d="M280 260 L310 270 L280 280 M570 260 L600 270 L570 280 M860 260 L890 270 L860 280 M1110 260 L1140 270 L1110 280"/><path d="M150 320 C150 405 710 405 710 330 M710 330 C710 405 980 405 980 330" stroke="#9aa9b8" stroke-dasharray="10 10"/></g>
  <rect x="340" y="440" width="720" height="56" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="476" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#374b60">残差连接让原输入绕过子层直接参与下一步</text>
</svg>
