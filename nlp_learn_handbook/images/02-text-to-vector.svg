<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#f7fafc"/>
  <text x="70" y="70" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">从文本到模型输入</text>
  <text x="70" y="112" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526579">token id 只是词表索引，embedding 才是供模型计算的稠密向量</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="55" y="190" width="210" height="110" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/>
    <text x="160" y="235" font-size="24" font-weight="700" fill="#194c4b">原始文本</text>
    <text x="160" y="272" font-size="22" fill="#194c4b">我 喜欢 猫</text>
    <rect x="335" y="190" width="210" height="110" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/>
    <text x="440" y="235" font-size="24" font-weight="700" fill="#1f4d7a">token 化</text>
    <text x="440" y="272" font-size="22" fill="#1f4d7a">[我, 喜欢, 猫]</text>
    <rect x="615" y="190" width="210" height="110" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/>
    <text x="720" y="235" font-size="24" font-weight="700" fill="#7a4c10">token id</text>
    <text x="720" y="272" font-size="22" fill="#7a4c10">[2, 3, 4]</text>
    <rect x="895" y="170" width="230" height="150" rx="8" fill="#ffffff" stroke="#638a5e" stroke-width="3"/>
    <text x="1010" y="210" font-size="23" font-weight="700" fill="#35592f">Embedding 表 E</text>
    <text x="1010" y="247" font-size="19" fill="#35592f">第 2、3、4 行</text>
    <text x="1010" y="282" font-size="19" fill="#35592f">查表得到向量</text>
    <rect x="1190" y="190" width="155" height="110" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/>
    <text x="1267" y="235" font-size="24" font-weight="700" fill="#64316c">向量序列</text>
    <text x="1267" y="272" font-size="20" fill="#64316c">(L, H)</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M265 245 H325 M545 245 H605 M825 245 H885 M1125 245 H1180"/>
    <path d="M320 235 L335 245 L320 255 M600 235 L615 245 L600 255 M880 235 L895 245 L880 255 M1175 235 L1190 245 L1175 255"/>
  </g>
  <text x="80" y="405" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#16324f">同一份表示根据任务产生不同输出结构</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="110" y="460" width="280" height="120" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/>
    <text x="250" y="510" font-size="25" font-weight="700" fill="#1f4d7a">文本分类</text>
    <text x="250" y="550" font-size="20" fill="#1f4d7a">(B, H) -> (B, C)</text>
    <rect x="560" y="460" width="280" height="120" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/>
    <text x="700" y="510" font-size="25" font-weight="700" fill="#194c4b">序列标注 / NER</text>
    <text x="700" y="550" font-size="20" fill="#194c4b">(B, L, H) -> (B, L, C)</text>
    <rect x="1010" y="460" width="280" height="120" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/>
    <text x="1150" y="510" font-size="25" font-weight="700" fill="#7a4c10">序列到序列 / 生成</text>
    <text x="1150" y="550" font-size="20" fill="#7a4c10">逐步预测下一个 token</text>
  </g>
</svg>
