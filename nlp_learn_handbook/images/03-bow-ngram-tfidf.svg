<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#f7fafc"/>
  <text x="70" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">经典表示分别保留了什么信息</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="250" y="145" font-size="25" font-weight="700" fill="#194c4b">词袋模型</text>
    <rect x="70" y="180" width="360" height="100" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="250" y="220" font-size="20" fill="#194c4b">猫追狗 / 狗追猫</text><text x="250" y="255" font-size="19" fill="#194c4b">都变成 {猫:1, 追:1, 狗:1}</text>
    <rect x="70" y="330" width="360" height="100" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="250" y="370" font-size="20" fill="#374b60">保留：词频</text><text x="250" y="405" font-size="19" fill="#374b60">丢失：词序和上下文</text>
    <text x="700" y="145" font-size="25" font-weight="700" fill="#1f4d7a">n-gram</text>
    <rect x="520" y="180" width="360" height="100" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="700" y="220" font-size="20" fill="#1f4d7a">bigram：猫追、追狗</text><text x="700" y="255" font-size="19" fill="#1f4d7a">与 狗追、追猫 不同</text>
    <rect x="520" y="330" width="360" height="100" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="370" font-size="20" fill="#374b60">保留：局部顺序</text><text x="700" y="405" font-size="19" fill="#374b60">代价：n 越大越稀疏</text>
    <text x="1150" y="145" font-size="25" font-weight="700" fill="#7a4c10">TF-IDF</text>
    <rect x="970" y="180" width="360" height="100" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="1150" y="220" font-size="20" fill="#7a4c10">当前文档词频</text><text x="1150" y="255" font-size="19" fill="#7a4c10">乘以全体文档稀有度</text>
    <rect x="970" y="330" width="360" height="100" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="1150" y="370" font-size="20" fill="#374b60">常见词权重降低</text><text x="1150" y="405" font-size="19" fill="#374b60">仍不是上下文表示</text>
  </g>
  <rect x="240" y="510" width="920" height="60" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="548" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#374b60">经典方法的比较重点：信息保留范围、稀疏性、可解释性和作为基线的成本</text>
</svg>
