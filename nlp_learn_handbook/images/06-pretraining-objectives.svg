<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#f7fafc"/>
  <text x="70" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">BERT 与 GPT 的预训练目标</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="350" y="145" font-size="26" font-weight="700" fill="#1f4d7a">BERT：Masked Language Model</text>
    <rect x="80" y="190" width="540" height="90" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="350" y="245" font-size="22" fill="#1f4d7a">我 喜欢 [MASK] 和 书</text>
    <rect x="80" y="350" width="540" height="105" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/><text x="350" y="395" font-size="22" fill="#194c4b">读取左右两侧有效上下文</text><text x="350" y="430" font-size="21" fill="#194c4b">预测被遮住的 token：猫</text>
    <text x="1050" y="145" font-size="26" font-weight="700" fill="#7a4c10">GPT：Next-token prediction</text>
    <rect x="780" y="190" width="540" height="90" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="1050" y="245" font-size="22" fill="#7a4c10">问题：我喜欢</text>
    <rect x="780" y="350" width="540" height="105" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/><text x="1050" y="395" font-size="22" fill="#35592f">只读取当前位置之前的前缀</text><text x="1050" y="430" font-size="21" fill="#35592f">预测下一个 token：猫</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M350 280 V340 M1050 280 V340"/><path d="M340 320 L350 350 L360 320 M1040 320 L1050 350 L1060 320"/></g>
  <rect x="270" y="515" width="860" height="56" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="551" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#374b60">训练时都可以并行计算多个位置，推理时 GPT 通常要逐 token 生成</text>
</svg>
