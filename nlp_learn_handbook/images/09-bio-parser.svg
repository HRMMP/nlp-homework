<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#f7fafc"/>
  <text x="70" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">BIO 标签如何还原为实体</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="300" y="145" font-size="25" font-weight="700" fill="#1f4d7a">输入标签序列</text>
    <rect x="70" y="190" width="460" height="95" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/><text x="300" y="245" font-size="22" fill="#1f4d7a">B-PER  I-PER  O  B-ORG  I-ORG</text>
    <text x="300" y="365" font-size="25" font-weight="700" fill="#7a4c10">解析状态</text>
    <rect x="70" y="410" width="460" height="95" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/><text x="300" y="465" font-size="21" fill="#7a4c10">开始实体 -> 延续 -> 结束</text>
    <text x="1050" y="145" font-size="25" font-weight="700" fill="#35592f">输出实体集合</text>
    <rect x="800" y="190" width="500" height="95" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/><text x="1050" y="245" font-size="21" fill="#35592f">[张三, PER]  [北京大学, ORG]</text>
    <rect x="800" y="410" width="500" height="95" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/><text x="1050" y="450" font-size="21" fill="#64316c">边界和类别</text><text x="1050" y="480" font-size="19" fill="#64316c">都正确才计为 TP</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"><path d="M300 285 V395 M530 460 H780"/><path d="M290 375 L300 410 L310 375 M750 450 L800 460 L750 470"/></g>
  <rect x="300" y="550" width="800" height="45" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/><text x="700" y="580" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#374b60">I-X 没有匹配的 B-X 或类别不一致时，应记录为非法标签，不要静默改成 O</text>
</svg>
