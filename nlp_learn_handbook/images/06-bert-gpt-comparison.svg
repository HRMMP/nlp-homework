<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f7fafc"/>
  <text x="70" y="65" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">BERT 与 GPT：同一类骨干，不同的可见范围和输出方式</text>
  <line x1="700" y1="135" x2="700" y2="650" stroke="#c9d4df" stroke-width="2"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="350" y="145" font-size="29" font-weight="700" fill="#1f4d7a">BERT：理解整句</text>
    <rect x="105" y="190" width="490" height="92" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/>
    <text x="350" y="230" font-size="23" font-weight="700" fill="#1f4d7a">双向 Encoder self-attention</text>
    <text x="350" y="264" font-size="19" fill="#1f4d7a">有效位置可读取前后文</text>
    <rect x="105" y="345" width="490" height="92" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/>
    <text x="350" y="385" font-size="23" font-weight="700" fill="#194c4b">每个位置输出 hidden state</text>
    <text x="350" y="419" font-size="19" fill="#194c4b">(B, L, H)</text>
    <rect x="105" y="500" width="490" height="92" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/>
    <text x="350" y="540" font-size="23" font-weight="700" fill="#64316c">NER 分类头</text>
    <text x="350" y="574" font-size="19" fill="#64316c">每个 token -> BIO 标签</text>
    <text x="1050" y="145" font-size="29" font-weight="700" fill="#7a4c10">GPT：逐步生成</text>
    <rect x="805" y="190" width="490" height="92" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/>
    <text x="1050" y="230" font-size="23" font-weight="700" fill="#7a4c10">causal Decoder self-attention</text>
    <text x="1050" y="264" font-size="19" fill="#7a4c10">位置 t 只读取 t 之前</text>
    <rect x="805" y="345" width="490" height="92" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/>
    <text x="1050" y="385" font-size="23" font-weight="700" fill="#35592f">next-token logits</text>
    <text x="1050" y="419" font-size="19" fill="#35592f">P(x_t | x_1, ..., x_{t-1})</text>
    <rect x="805" y="500" width="490" height="92" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/>
    <text x="1050" y="540" font-size="23" font-weight="700" fill="#64316c">生成循环</text>
    <text x="1050" y="574" font-size="19" fill="#64316c">选择 token -> 拼接 -> 继续</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 282 V335 M350 437 V490 M1050 282 V335 M1050 437 V490"/>
    <path d="M340 325 L350 345 L360 325 M340 480 L350 500 L360 480 M1040 325 L1050 345 L1060 325 M1040 480 L1050 500 L1060 480"/>
  </g>
  <rect x="260" y="665" width="880" height="50" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/>
  <text x="700" y="698" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#374b60">BERT 适合按位置做理解任务；GPT 适合根据前缀做自回归生成</text>
</svg>
