<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f7fafc"/>
  <text x="70" y="65" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#16324f">机器翻译实验：从数据对到可复核的 BLEU</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="70" y="190" width="210" height="110" rx="8" fill="#dff3f0" stroke="#3a9d96" stroke-width="3"/>
    <text x="175" y="235" font-size="24" font-weight="700" fill="#194c4b">平行语料</text>
    <text x="175" y="271" font-size="19" fill="#194c4b">source / target</text>
    <rect x="340" y="190" width="210" height="110" rx="8" fill="#e4eefb" stroke="#4d82bd" stroke-width="3"/>
    <text x="445" y="235" font-size="24" font-weight="700" fill="#1f4d7a">tokenizer</text>
    <text x="445" y="271" font-size="19" fill="#1f4d7a">ids + 特殊 token</text>
    <rect x="610" y="190" width="210" height="110" rx="8" fill="#fff1d6" stroke="#d18c2f" stroke-width="3"/>
    <text x="715" y="235" font-size="24" font-weight="700" fill="#7a4c10">Transformer</text>
    <text x="715" y="271" font-size="19" fill="#7a4c10">mask + teacher forcing</text>
    <rect x="880" y="190" width="210" height="110" rx="8" fill="#f4e5f5" stroke="#9a5ba4" stroke-width="3"/>
    <text x="985" y="235" font-size="24" font-weight="700" fill="#64316c">生成</text>
    <text x="985" y="271" font-size="19" fill="#64316c">greedy / beam</text>
    <rect x="1150" y="190" width="180" height="110" rx="8" fill="#e9f0e6" stroke="#638a5e" stroke-width="3"/>
    <text x="1240" y="235" font-size="24" font-weight="700" fill="#35592f">BLEU</text>
    <text x="1240" y="271" font-size="19" fill="#35592f">独立评估</text>
  </g>
  <g fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 245 H330 M550 245 H600 M820 245 H870 M1090 245 H1140"/>
    <path d="M320 235 L340 245 L320 255 M590 235 L610 245 L590 255 M860 235 L880 245 L860 255 M1130 235 L1150 245 L1130 255"/>
  </g>
  <rect x="150" y="405" width="1100" height="190" rx="8" fill="#ffffff" stroke="#c9d4df" stroke-width="2"/>
  <text x="700" y="450" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#16324f">必须保存的证据</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#374b60">
    <text x="230" y="500">配置：语言方向、词表、mask、解码参数</text>
    <text x="230" y="545">预测：source、reference、prediction</text>
    <text x="800" y="500">评估：实现、版本、tokenization、平滑</text>
    <text x="800" y="545">分析：漏译、错译、重复、专名和长句错误</text>
  </g>
  <text x="700" y="675" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526579">BLEU 只是一个指标；逐样本预测和错误分析才让分数可以追溯</text>
</svg>
